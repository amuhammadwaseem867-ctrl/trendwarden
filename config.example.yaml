# TrendWarden configuration. Copy to config.yaml and edit.

exchange: binance        # any ccxt exchange id: binance, kraken, bybit, okx, coinbase, kucoin...
testnet: false           # true = exchange sandbox (supported by binance, bybit, okx, ...)
symbols: [BTC/USDT, ETH/USDT]   # spot pairs; all must share one quote currency
timeframe: 4h            # candle size: 15m, 1h, 4h, 1d ...
history_days: 730        # how much history backtest/optimise download

strategy:
  name: trend_momentum   # trend_momentum | mean_reversion | breakout
  params:                # leave empty to use the defaults (see bot/strategies.py)
    fast_ema: 21
    slow_ema: 55
    trend_ema: 200
    adx_min: 20
    rsi_max_entry: 70

risk:
  risk_per_trade_pct: 1.0   # lose at most ~1% of equity if a stop is hit
  max_position_pct: 25      # no single position larger than 25% of equity
  max_open_positions: 3
  max_daily_loss_pct: 3     # no new trades for the rest of the day after -3%
  max_drawdown_pct: 15      # KILL SWITCH: close everything and halt at -15% from peak
  atr_stop_mult: 2.0        # initial stop = entry - 2 x ATR
  atr_trail_mult: 3.0       # trailing stop = highest close - 3 x ATR (0 disables)
  reward_risk: 2.5          # take profit at 2.5R (0 disables, rely on trail/signal)
  cooldown_bars: 3          # wait 3 candles after a losing trade before re-entering

execution:
  fee_pct: 0.1              # your exchange taker fee, per side
  slippage_pct: 0.05
  poll_seconds: 30
  starting_cash: 10000      # backtest and paper-trading balance

# ---- Market intelligence (uses the bundled Trader skill pack) ----
intel:
  data_timezone: UTC             # crypto exchanges report candles in UTC
  news_guard:                    # no new trades around big US news (gold's wildest moves)
    enabled: false               # mostly useful for gold/forex
    jobs_report: true            # first Friday of the month, 08:30 New York
    # Fed decision days (14:00 New York). Check/add at federalreserve.gov:
    fomc_dates: [2026-01-28, 2026-03-18, 2026-04-29, 2026-06-17, 2026-07-29, 2026-09-16, 2026-10-28, 2026-12-09]
    extra_events: []             # e.g. CPI days from bls.gov: ["2026-11-12 08:30"] (New York time)
    minutes_before: 30
    minutes_after: 90
    headlines: true              # breaking gold headlines (Yahoo Finance) pause entries too
    headline_pause_minutes: 60
    protect_profits: true        # when a pause starts, move winning trades' stops to break-even
    in_backtest: true            # apply the schedule in backtest/discover as well
  smart_money:                   # big funds' gold ETF positions from SEC 13F filings (slow signal)
    enabled: false               # needs SEC_USER_AGENT in .env
    mode: info                   # info = report only | filter = no new buys while funds are cutting gold
  congress:                      # alert when Congress members disclose gold / miner trades
    enabled: false
    poll_hours: 6

state_dir: state

# Real-money trading stays off until you set this to true AND run
# `python main.py live --confirm-live`. Paper trade first.
live_enabled: false
