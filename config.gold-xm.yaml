# TrendWarden - GOLD on XM (MetaTrader 5).
# Copy to config.yaml:   copy config.gold-xm.yaml config.yaml   (Windows)

platform: mt5            # MetaTrader 5 (XM). The MT5 terminal must be open and logged in.
symbols: [GOLD]          # XM's MT5 gold symbol is usually GOLD. If yours differs (e.g. GOLD#, XAUUSD),
                         # the bot lists the gold symbols on your account when it can't find this one.
timeframe: 1h            # 1m, 5m, 15m, 30m, 1h, 4h, 1d
history_days: 730        # MT5 only returns as many bars as "Max bars in chart" allows
                         # (Tools > Options > Charts) - set it to Unlimited for long backtests.

strategy:
  name: trend_momentum   # gold trends well; also try breakout. Run `optimise` before going live.
  params:
    fast_ema: 21
    slow_ema: 55
    trend_ema: 200
    adx_min: 20
    rsi_max_entry: 70

risk:
  risk_per_trade_pct: 1.0   # each losing trade costs ~1% of your account
  max_position_pct: 300     # CFDs are leveraged: allow position value up to 3x equity.
                            # Your loss is still capped by the stop-loss and risk_per_trade_pct.
  max_open_positions: 1
  max_daily_loss_pct: 3
  max_drawdown_pct: 15      # KILL SWITCH
  atr_stop_mult: 2.0
  atr_trail_mult: 3.0
  reward_risk: 2.5
  cooldown_bars: 3

execution:
  fee_pct: 0                # XM Standard/Micro: no commission (cost is in the spread)
  slippage_pct: 0.02        # models the gold spread + slippage per fill
  poll_seconds: 15
  starting_cash: 10000      # backtest/paper balance
  leverage: 100             # backtest/paper simulation of XM gold margin
  min_qty: 1                # 0.01 lot = 1 oz
  qty_step: 1

mt5:
  # Only needed if the bot can't find MT5 itself. Use SINGLE quotes:
  # path: 'C:\Program Files\XM Global MT5\terminal64.exe'
  magic: 240611             # tags the bot's orders so it never touches your manual trades
  deviation: 30             # max slippage accepted on market orders, in points

state_dir: state
live_enabled: false
